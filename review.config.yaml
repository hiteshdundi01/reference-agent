# The repo's values for docs/REVIEW_PROTOCOL.md. When a product renames or adds
# modules, update mvp_dual and high_stakes to match (docs/ADAPTING.md).

models:
  gpt:
    name: GPT-6.1-Sol
    id: gpt-6.1-sol # codex -m; must match the Codex run header "model:"
  argon:
    name: Gemini 4 Argon
    id: gemini-4-argon-high # agy --model; the effort is part of the id
    label: "Gemini 4 Argon (High)" # must match agy --log-file label="..."
effort: high
timeout_seconds: 900

owner: "the repository owner" # adjudicates disputes; can't waive required reviews or failing criteria
tier: mvp # mvp | production; switch before any real user, personal data or externally reachable environment
unit_of_work: phase
default_target_branch: main
record_dir: docs/reviews # production tier only

# MVP tier: both reviewers for any change to these, and for the whole-branch review.
mvp_dual:
  - "backend/auth.py"
  - "backend/dependencies.py"
  - "backend/requests.py"
  - "agent/harness.py"
  - "agent/entrypoint.py"
  - "scripts/review-packet.mjs"
  - "scripts/review/**"
  - "scripts/review-prompt.md"
  - "review.config.yaml"
  - "docs/REVIEW_PROTOCOL.md"
  - "lefthook.yml"

# Always given to the reviewer with the diff and the touched files.
context_docs:
  - docs/CODE_STANDARDS.md
  - docs/SPEC.md

# Left out of every channel; changes here reach a reviewer only as metadata.
exclude_paths:
  secret:
    - "**/.env"
    - "**/.env.!(example)" # .env.example holds no secrets and is reviewed
    - "**/*.pem"
    - "**/*.key"
  personal_data: []
  sealed: [] # e.g. a held-out eval set or an answer key

# Too large to inline and generated by tools: reviewers see that they changed,
# not their contents. Any other file too large to inline stops the packet.
metadata_only:
  - "uv.lock"
  - "package-lock.json"

attestation_paths:
  - "docs/reviews/*.json"

# Production tier: any change under these globs gets both reviewers.
high_stakes:
  auth:
    - "backend/auth.py"
    - "backend/dependencies.py"
  payments:
    - "backend/requests.py"
  security_secrets:
    - "agent/entrypoint.py"
    - ".env.example"
  release_eval_gates:
    - "pyproject.toml"
    - "package.json"
    - "eslint.config.js"
    - ".github/workflows/**"
  review_tooling:
    - "scripts/review-packet.mjs"
    - "scripts/review/**"
    - "scripts/review-prompt.md"
    - "review.config.yaml"
    - "lefthook.yml"
    - "docs/REVIEW_PROTOCOL.md"
    - "docs/review-record.schema.json"
  not_applicable:
    privacy: "the example product holds no real personal data"
    deletion_retention: "nothing is deleted or retained beyond the local database"
    safety_policy: "no safety policy in the example product"
    migrations: "the database is rebuilt by seeding; there are no migrations"

# Approvals that stay human; a model review never satisfies them.
human_approvals:
  - "merging a build branch into main"
